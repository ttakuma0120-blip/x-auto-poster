services:
  - type: worker
    name: x-auto-poster
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r x_auto_poster/requirements.txt
    startCommand: python x_auto_poster/main.py
    envVars:
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TZ
        value: Asia/Tokyo
